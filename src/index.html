<!doctype html>
<html lang="en">
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
  />
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header>
      <div class="container">
        <a
          class="logo"
          href="images/logo.png"
        >
          <img
            src="images/logo.png"
            alt="Moyo"
          />
        </a>
        <nav>
          <ul class="nav__list">
            <li>
              <a
                class="is-active nav__link"
                href="#"
              >
                Apple
              </a>
            </li>
            <li>
              <a
                class="nav__link"
                href="#"
              >
                Samsung
              </a>
            </li>
            <li>
              <a
                class="nav__link"
                href="#"
              >
                Smartphones
              </a>
            </li>
            <li>
              <a
                class="nav__link"
                href="#"
                data-qa="hover"
              >
                Laptops & Computers
              </a>
            </li>
            <li>
              <a
                class="nav__link"
                href="#"
              >
                Gadgets
              </a>
            </li>
            <li>
              <a
                class="nav__link"
                href="#"
              >
                Tablets
              </a>
            </li>
            <li>
              <a
                class="nav__link"
                href="#"
              >
                Photo
              </a>
            </li>
            <li>
              <a
                class="nav__link"
                href="#"
              >
                Video
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
